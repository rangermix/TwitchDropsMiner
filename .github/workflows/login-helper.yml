name: Native login helper

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit verified by the release caller
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            extension: ''
          - runner: macos-15
            platform: macos-arm64
            extension: ''
          - runner: macos-15-intel
            platform: macos-x64
            extension: ''
          - runner: windows-2022
            platform: windows-x64
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Build from locked application dependencies
        run: |
          python -m venv env
          if [ "$RUNNER_OS" = Windows ]; then source env/Scripts/activate; else source env/bin/activate; fi
          uv sync --active --locked --extra dev --python 3.12
          uv pip install -r packaging/login-helper-requirements.txt
          python -m pytest tests/test_login_helper.py tests/test_session_helper.py tests/test_session_bootstrap.py
          python -m PyInstaller --clean --noconfirm packaging/login_helper.spec
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python packaging/smoke_login_helper.py dist/tdm-login-helper${{ matrix.extension }} --browser
          else
            python packaging/smoke_login_helper.py dist/tdm-login-helper${{ matrix.extension }} --browser
          fi
      - name: Archive executable with permissions preserved
        run: |
          tar -czf tdm-login-helper-${{ matrix.platform }}.tar.gz -C dist tdm-login-helper${{ matrix.extension }} -C "$GITHUB_WORKSPACE" LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: tdm-login-helper-${{ matrix.platform }}
          path: tdm-login-helper-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          overwrite: true

  prepare-assets:
    name: Validate native release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tdm-login-helper-*-*
          path: helper-artifacts
          merge-multiple: true
      - name: Validate archives and generate versioned checksums
        run: |
          python -m venv env
          source env/bin/activate
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python .github/scripts/prepare_helper_release.py --artifacts helper-artifacts --output release-assets --version "$VERSION"
          cd release-assets
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tdm-login-helper-release
          path: release-assets/
          if-no-files-found: error
          overwrite: true
